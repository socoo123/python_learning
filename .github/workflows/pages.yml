# 把 web/ 里已经生成好的静态页发布到 GitHub Pages。
# 仓库设置里 Pages 的 Source 要选 GitHub Actions。
# 站点地址是 https://<user>.github.io/python_learning/ ,页面用相对路径,不依赖仓库名。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp web/index.html web/.nojekyll _site/
          cp -R web/chapters web/modules web/assets _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
